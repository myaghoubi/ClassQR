<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور و غیاب کلاس</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pri:#1d4ed8;--bd:#dde3ee;--ok:#15803d;--err:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182033;--tx:#e8ecf5;--mut:#98a2b8;--pri:#5b8def;--bd:#2a3550;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}header small{opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 2px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:bold;border-top:3px solid var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;gap:8px}.row>*{flex:1}
.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
.msg.ok{background:#15803d22;color:var(--ok)}.msg.err{background:#b91c1c22;color:var(--err)}
#map{height:260px;border-radius:10px;margin-top:8px}
#qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px}
#qrbox canvas,#qrbox img{max-width:100%}
#scanner{position:fixed;inset:0;background:#000d;z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#scanner .vwrap{position:relative;width:92%;max-width:420px;aspect-ratio:1;overflow:hidden;border-radius:14px;background:#000}
#scanner video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:16%;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.55);transition:box-shadow .25s}
.frame i{position:absolute;width:30px;height:30px;border:4px solid #fff;transition:.25s}
.frame i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.frame i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.frame i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.frame i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.frame b{position:absolute;left:5%;right:5%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#4ade80,transparent);box-shadow:0 0 12px #4ade80;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:5%}to{top:95%}}
.frame.found{box-shadow:0 0 0 999px rgba(21,128,61,.5)}
.frame.found i{border-color:#4ade80;transform:scale(1.2)}
.frame.found b{display:none}
.frame.found::after{content:"";position:absolute;inset:0;border-radius:12px;background:#4ade80;animation:flash .55s ease-out forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
#result{position:fixed;inset:0;z-index:1000;background:#000b;display:none;align-items:center;justify-content:center}
#result.show{display:flex}
.rbox{background:var(--card);color:var(--tx);border-radius:18px;padding:26px 30px;text-align:center;max-width:86%;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.rbox svg{width:96px;height:96px;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rbox circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .5s .05s forwards}
.rbox path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#result.ok svg{stroke:var(--ok)}#result.err svg{stroke:var(--err)}
#result.busy svg{display:none}
.spin{display:none;width:56px;height:56px;margin:0 auto 8px;border:5px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:rot .8s linear infinite}
#result.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
#rt{margin:10px 0 0;font-size:15px;line-height:1.7}
.sess{border-bottom:1px solid var(--bd);padding:8px 0;font-size:14px}.sess:last-child{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--pri);color:#fff}
.tag.off{background:var(--mut)}
details{margin-top:6px}summary{cursor:pointer;color:var(--pri)}
.hide{display:none}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}#printarea{display:block!important;text-align:center}}
#printarea{display:none}
</style>
</head>
<body>
<header><h1>حضور و غیاب کلاس</h1><small id="ver"></small></header>
<main>
<!-- استاد -->
<section id="p-prof"><div class="card"><b>ورود / خروج استاد</b>
<label>نام استاد</label><input id="pName"><label>نام درس</label><input id="pCourse">
<button class="btn" onclick="startScan('prof')">اسکن بارکد کلاس</button><div id="m-prof"></div></div></section>
<!-- دانشجو -->
<section id="p-stu" class="hide"><div class="card"><b>ورود / خروج دانشجو</b>
<label>نام و نام خانوادگی</label><input id="sName"><label>شماره دانشجویی</label><input id="sId" inputmode="numeric">
<button class="btn" onclick="startScan('stu')">اسکن بارکد کلاس</button><div id="m-stu"></div></div></section>
<!-- تولید بارکد -->
<section id="p-gen" class="hide"><div class="card noprint"><b>تولید بارکد کلاس</b>
<label>شماره کلاس</label><input id="gNum">
<label>موقعیت کلاس (روی نقشه کلیک کنید)</label><div id="map"></div>
<div class="row"><div><label>عرض جغرافیایی</label><input id="gLat" inputmode="decimal"></div><div><label>طول جغرافیایی</label><input id="gLng" inputmode="decimal"></div></div>
<button class="btn sec" onclick="myPos()">موقعیت فعلی من</button>
<button class="btn" onclick="genQR()">تولید بارکد</button><div id="m-gen"></div></div>
<div class="card" id="printarea"><h2 id="pTitle"></h2><div id="qrbox"></div></div>
<div id="qrwrap" class="card hide noprint"><div id="qrbox2" style="text-align:center"></div><button class="btn" onclick="window.print()">چاپ بارکد</button></div></section>
<!-- سوابق -->
<section id="p-log" class="hide"><div class="card"><b>سوابق حضور</b><div id="logs"></div>
<button class="btn sec" onclick="syncNow()">همگام‌سازی با سرور</button>
<div id="syncst"></div>
<button class="btn sec" onclick="exportCSV()">خروجی CSV</button>
<button class="btn sec" onclick="if(confirm('همه سوابق پاک شود؟')){db.sessions=[];save();renderLogs()}">پاک کردن سوابق</button></div>
<div class="card"><label>شعاع مجاز از موقعیت کلاس (متر) — فقط برای علامت‌گذاری در سوابق؛ مانع ثبت حضور نمی‌شود</label><input id="radius" inputmode="numeric" onchange="db.radius=+this.value||100;save()"></div></section>
<!-- درباره -->
<section id="p-about" class="hide"><div class="card"><b>نسخه جاری: <span id="cur"></span></b></div>
<div class="card"><b>سابقه تغییرات</b><div id="chg"></div></div></section>
</main>
<nav id="nav"></nav>
<div id="scanner"><div class="vwrap"><video id="vid" playsinline muted></video>
<div class="frame" id="frame"><i></i><i></i><i></i><i></i><b></b></div></div><canvas id="cv" class="hide"></canvas>
<div style="color:#fff" id="scanHint">بارکد را داخل کادر قرار دهید</div><button class="btn" onclick="stopScan()">بستن</button></div>

<div id="result" onclick="hideFx()"><div class="rbox"><div class="spin"></div>
<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path id="rp" d=""/></svg><p id="rt"></p></div></div>

<script src="lib/leaflet.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const VERSION='1.3.0';
const CHANGELOG=[{v:'1.3.0',d:'۱۴۰۵/۰۹/۰۶',items:['فاصله فرد از محل کلاس دیگر مانع ثبت حضور نمی‌شود؛ فاصله به‌صورت متر همراه با هر ورود و خروج (استاد و دانشجو) ثبت می‌شود','نمایش فاصله در سوابق (خارج از شعاع مجاز با رنگ قرمز) و ستون فاصله در خروجی CSV','در صورت در دسترس نبودن موقعیت مکانی نیز حضور ثبت می‌شود و فاصله «نامشخص» می‌ماند','فاصله هم در پایگاه داده Supabase همگام‌سازی می‌شود']},{v:'1.2.0',d:'۱۴۰۵/۰۹/۰۵',items:['کتابخانه‌های نقشه، بارکدساز و بارکدخوان داخل برنامه قرار گرفتند (بدون نیاز به CDN)','همگام‌سازی سوابق با پایگاه داده Supabase در کنار ذخیره محلی','دانشجو و استاد می‌توانند با دو دستگاه جدا روی یک کلاس کار کنند (دریافت وضعیت کلاس از سرور هنگام اسکن)','ارسال خودکار داده‌های ذخیره‌شده در حالت آفلاین پس از اتصال مجدد و دکمه همگام‌سازی دستی در تب سوابق']},{v:'1.1.0',d:'۱۴۰۵/۰۹/۰۵',items:['کادر مربعی روی تصویر دوربین همراه با خط اسکن متحرک','افکت تشخیص بارکد (چشمک سبز، بیپ و لرزش)','افکت نتیجه ثبت: تیک سبز برای موفقیت و علامت قرمز برای خطا','خواندن بارکد فقط از داخل کادر برای سرعت و دقت بیشتر']},{v:'1.0.0',d:'۱۴۰۵/۰۹/۰۵',items:['انتشار اولیه','تولید و چاپ بارکد کلاس با موقعیت جغرافیایی و شماره کلاس','ثبت ورود/خروج استاد و دانشجو با اسکن بارکد (نوبت فرد ورود، زوج خروج)','ثبت خروج خودکار همه دانشجویان هنگام خروج استاد','نصب‌پذیر (PWA) و کارکرد آفلاین']}];
const $=id=>document.getElementById(id);
let db=JSON.parse(localStorage.getItem('cls_db')||'null')||{sessions:[],radius:100,profile:{}};
const save=()=>localStorage.setItem('cls_db',JSON.stringify(db));
const fa=t=>new Date(t).toLocaleString('fa-IR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ناوبری */
const TABS=[['prof','استاد'],['stu','دانشجو'],['gen','بارکد'],['log','سوابق'],['about','نسخه']];
$('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('');
function tab(t){TABS.forEach(x=>{$('p-'+x[0]).classList.toggle('hide',x[0]!==t)});
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
if(t==='log')renderLogs();if(t==='gen')initMap()}
tab('prof');

/* نسخه */
$('ver').textContent='نسخه '+VERSION;$('cur').textContent=VERSION;
$('chg').innerHTML=CHANGELOG.map(c=>`<div class="sess"><b>نسخه ${c.v}</b> <small>(${c.d})</small><ul>${c.items.map(i=>'<li>'+i+'</li>').join('')}</ul></div>`).join('');

/* پروفایل ذخیره‌شده */
['pName','pCourse','sName','sId'].forEach(k=>{$(k).value=db.profile[k]||'';$(k).addEventListener('input',()=>{db.profile[k]=$(k).value;save()})});
$('radius').value=db.radius||100;

/* نقشه */
let map,marker;
function setPt(lat,lng){$('gLat').value=(+lat).toFixed(6);$('gLng').value=(+lng).toFixed(6);
if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng]).addTo(map)}
function initMap(){if(map){setTimeout(()=>map.invalidateSize(),100);return}
if(!window.L){$('map').textContent='نقشه بارگذاری نشد؛ مختصات را دستی وارد کنید.';return}
map=L.map('map').setView([35.6892,51.389],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.on('click',e=>setPt(e.latlng.lat,e.latlng.lng))}
function myPos(){navigator.geolocation.getCurrentPosition(p=>{initMap();setPt(p.coords.latitude,p.coords.longitude);map&&map.setView([p.coords.latitude,p.coords.longitude],17)},()=>msg('m-gen','دسترسی به موقعیت ممکن نشد','err'),{enableHighAccuracy:true})}

/* تولید بارکد */
function genQR(){const n=$('gNum').value.trim(),lat=parseFloat($('gLat').value),lng=parseFloat($('gLng').value);
if(!n||isNaN(lat)||isNaN(lng))return msg('m-gen','شماره کلاس و موقعیت را مشخص کنید','err');
const payload=JSON.stringify({t:'CLS',n,lat:+lat.toFixed(6),lng:+lng.toFixed(6)});
['qrbox','qrbox2'].forEach(id=>{$(id).innerHTML='';new QRCode($(id),{text:payload,width:id==='qrbox'?360:240,height:id==='qrbox'?360:240,correctLevel:QRCode.CorrectLevel.M})});
$('pTitle').textContent='کلاس شماره '+n;$('qrbox2').insertAdjacentHTML('afterbegin','<h3>کلاس '+n+'</h3>');
$('qrwrap').classList.remove('hide');msg('m-gen','بارکد تولید شد','ok')}

/* پیام */
function msg(id,t,c){$(id).innerHTML=`<div class="msg ${c}">${t}</div>`;if(afterScan&&(id==='m-prof'||id==='m-stu')){afterScan=false;fx(c,t)}}

/* همگام‌سازی با Supabase */
const SB=window.CLASSQR_SUPABASE||{};
const sb=(window.supabase&&SB.url&&SB.key)?window.supabase.createClient(SB.url,SB.key,{auth:{persistSession:false,autoRefreshToken:false}}):null;
db.dirty=db.dirty||{};
const setSync=(t,c)=>{const e=$('syncst');if(e)e.innerHTML=t?`<div class="msg ${c||''}">${t}</div>`:''};
const tmo=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
function mergeRemote(ss,evs){
ss.forEach(r=>{let s=db.sessions.find(x=>x.id===r.id);
 if(!s){db.sessions.push({id:r.id,cls:r.cls,prof:r.prof,course:r.course,start:+r.start_at,end:r.end_at==null?null:+r.end_at,sd:r.start_dist_m,ed:r.end_dist_m,students:[]})}
 else{if(s.end==null&&r.end_at!=null){s.end=+r.end_at;s.ed=r.end_dist_m}
  if(s.sd==null&&r.start_dist_m!=null)s.sd=r.start_dist_m}});
evs.forEach(e=>{const s=db.sessions.find(x=>x.id===e.session_id);if(!s)return;
 let t=s.students.find(x=>x.id===e.student_id);if(!t){t={id:e.student_id,name:e.student_name,ev:[]};s.students.push(t)}
 const pr=t.ev.map((x,i)=>[x,(t.dist&&t.dist[i])??null]),k=pr.find(x=>x[0]===+e.ts);
 if(k){if(k[1]==null)k[1]=e.dist_m}else pr.push([+e.ts,e.dist_m]);
 pr.sort((a,b)=>a[0]-b[0]);t.ev=pr.map(x=>x[0]);t.dist=pr.map(x=>x[1]??null)});
db.sessions.sort((a,b)=>a.start-b.start)}
async function pull(cls){if(!sb)return;
let q=sb.from('classqr_sessions').select('*').order('start_at',{ascending:false});
q=cls?q.eq('cls',cls).limit(5):q.limit(500);
const a=await q;if(a.error)throw a.error;
const ids=a.data.map(r=>r.id),ev=[];
for(let i=0;i<ids.length;i+=30){const part=ids.slice(i,i+30);
 for(let from=0;;from+=1000){const b=await sb.from('classqr_events').select('*').in('session_id',part).order('id').range(from,from+999);
  if(b.error)throw b.error;ev.push(...b.data);if(b.data.length<1000)break}}
mergeRemote(a.data,ev);save()}
let pushing=null;
function push(){if(!sb)return Promise.resolve();
if(pushing)return pushing.then(()=>push());
const me=pushing=(async()=>{try{await 0;const ids=Object.keys(db.dirty);if(!ids.length)return;
 const ss=db.sessions.filter(s=>db.dirty[s.id]);
 if(ss.length){let r=await sb.from('classqr_sessions').upsert(ss.map(s=>({id:s.id,cls:s.cls,prof:s.prof,course:s.course||'',start_at:s.start,start_dist_m:s.sd??null,end_at:null})),{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
  for(const s of ss.filter(s=>s.end!=null)){r=await sb.from('classqr_sessions').update({end_at:s.end,end_dist_m:s.ed??null}).eq('id',s.id).is('end_at',null);if(r.error)throw r.error}}
 const ev=[];ss.forEach(s=>s.students.forEach(t=>t.ev.forEach((ts,i)=>ev.push({id:s.id+':'+t.id+':'+ts,session_id:s.id,student_id:t.id,student_name:t.name,ts,dist_m:(t.dist&&t.dist[i])??null}))));
 for(let i=0;i<ev.length;i+=200){const r=await sb.from('classqr_events').upsert(ev.slice(i,i+200),{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error}
 ids.forEach(k=>{if(ss.some(s=>s.id===k))delete db.dirty[k]});save()}finally{if(pushing===me)pushing=null}})();
return me}
const touch=s=>{db.dirty[s.id]=1;save();push().catch(()=>{})};
async function syncNow(){if(!sb)return setSync('اتصال به سرور تنظیم نشده است','err');
setSync('در حال همگام‌سازی...');
try{await tmo(pull(),20000);await tmo(push(),20000);renderLogs();setSync('همگام‌سازی انجام شد ('+fa(Date.now())+')','ok')}
catch(e){setSync('همگام‌سازی انجام نشد؛ داده‌ها روی دستگاه ذخیره هستند و بعداً ارسال می‌شوند','err')}}
addEventListener('online',()=>{push().catch(()=>{})});
push().catch(()=>{});

/* اسکن */
let stream,scanning=false,mode='';
async function startScan(m){mode=m;afterScan=false;hideFx();
if(m==='prof'&&(!$('pName').value.trim()||!$('pCourse').value.trim()))return msg('m-prof','نام استاد و نام درس را وارد کنید','err');
if(m==='stu'&&(!$('sName').value.trim()||!$('sId').value.trim()))return msg('m-stu','نام و شماره دانشجویی را وارد کنید','err');
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return msg('m-'+m,'دسترسی به دوربین ممکن نشد','err')}
$('vid').srcObject=stream;await $('vid').play();$('scanner').style.display='flex';scanning=true;loop()}
function stopScan(){scanning=false;$('frame').classList.remove('found');$('scanner').style.display='none';stream&&stream.getTracks().forEach(t=>t.stop())}
function beep(f,d){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
let fxT,afterScan=false;
function fx(state,text){clearTimeout(fxT);const r=$('result');r.className='show '+state;$('rt').textContent=text;
if(state!=='busy'){$('rp').setAttribute('d',state==='ok'?'M15 27l8 8 15-17':'M18 18l16 16M34 18L18 34');
const b=r.firstElementChild;b.style.animation='none';b.offsetWidth;b.style.animation='';
r.querySelectorAll('circle,path').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''});
if(state==='ok'){beep(880,.1);setTimeout(()=>beep(1320,.18),110);vib([60,40,60])}else{beep(220,.35);vib(300)}
fxT=setTimeout(hideFx,state==='ok'?2200:3200)}}
function hideFx(){clearTimeout(fxT);$('result').className=''}
function loop(){if(!scanning)return;const v=$('vid'),c=$('cv');
if(v.readyState===4){const vw=v.videoWidth,vh=v.videoHeight,side=Math.min(vw,vh)*.68,out=Math.min(Math.round(side),640);
c.width=c.height=out;const x=c.getContext('2d');x.drawImage(v,(vw-side)/2,(vh-side)/2,side,side,0,0,out,out);
const r=jsQR(x.getImageData(0,0,out,out).data,out,out);
if(r&&r.data){scanning=false;$('frame').classList.add('found');beep(1000,.12);vib(80);
setTimeout(()=>{stopScan();onScan(r.data)},600);return}}
requestAnimationFrame(loop)}

const dist=(a,b,c,d)=>{const R=6371000,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t;
const h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function getPos(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000}))}

function addEv(t,ts,m){t.dist=t.dist||[];while(t.dist.length<t.ev.length)t.dist.push(null);t.ev.push(ts);t.dist.push(m)}
const dtag=m=>m==null?'':` <span style="color:var(${m>(db.radius||100)?'--err':'--mut'})">(${m} متر)</span>`;
const dtxt=m=>m==null?'':` (${m} متر)`;
async function onScan(text){const out='m-'+mode;let d;afterScan=true;fx('busy','در حال بررسی موقعیت...');
try{d=JSON.parse(text);if(d.t!=='CLS')throw 0}catch(e){return msg(out,'بارکد معتبر نیست','err')}
let p=null;try{p=await getPos()}catch(e){}
const m=p?Math.round(dist(p.coords.latitude,p.coords.longitude,d.lat,d.lng)):null;
const dt=m==null?' — فاصله نامشخص (موقعیت در دسترس نبود)':` — فاصله حدود ${m} متر${m>(db.radius||100)?' (خارج از شعاع مجاز)':''}`;
try{await tmo(pull(d.n),8000)}catch(e){}
const now=Date.now(),act=db.sessions.find(s=>s.cls===d.n&&!s.end);
if(mode==='prof'){const name=$('pName').value.trim();
 if(!act){const ns={id:uid(),cls:d.n,prof:name,course:$('pCourse').value.trim(),start:now,end:null,sd:m,ed:null,students:[]};db.sessions.push(ns);touch(ns);
  return msg(out,`ورود استاد ثبت شد؛ کلاس ${d.n} از اکنون در اختیار شماست${dt}`,'ok')}
 if(act.prof!==name)return msg(out,`این کلاس هم‌اکنون در اختیار «${act.prof}» است`,'err');
 act.end=now;act.ed=m;act.students.forEach(s=>{if(s.ev.length%2)addEv(s,now,null)});touch(act);
 return msg(out,'خروج استاد ثبت شد و خروج همه دانشجویان نیز ثبت گردید'+dt,'ok')}
if(!act)return msg(out,'در حال حاضر استادی این کلاس را فعال نکرده است','err');
const id=$('sId').value.trim();let s=act.students.find(x=>x.id===id);
if(!s){s={id,name:$('sName').value.trim(),ev:[]};act.students.push(s)}
addEv(s,now,m);touch(act);
msg(out,(s.ev.length%2?`ورود شما ثبت شد (${fa(now)})`:`خروج شما ثبت شد (${fa(now)})`)+dt,'ok')}

/* سوابق */
function renderLogs(){$('logs').innerHTML=db.sessions.length?db.sessions.slice().reverse().map(s=>`<div class="sess">
<b>کلاس ${s.cls}</b> — ${s.course} — ${s.prof} <span class="tag ${s.end?'off':''}">${s.end?'پایان‌یافته':'فعال'}</span><br>
<small>ورود: ${fa(s.start)}${dtag(s.sd)}${s.end?' | خروج: '+fa(s.end)+dtag(s.ed):''}</small>
<details><summary>دانشجویان (${s.students.length})</summary>${s.students.map(t=>`<div>${t.name} (${t.id}): ${t.ev.map((e,i)=>(i%2?'خروج ':'ورود ')+new Date(e).toLocaleTimeString('fa-IR')+dtag(t.dist&&t.dist[i])).join('، ')}</div>`).join('')||'—'}</details></div>`).join(''):'<p>سابقه‌ای ثبت نشده است.</p>'}
function exportCSV(){const r=[['کلاس','درس','استاد','ورود استاد','فاصله استاد در ورود (متر)','خروج استاد','فاصله استاد در خروج (متر)','دانشجو','شماره دانشجویی','ورود/خروج‌ها']];
db.sessions.forEach(s=>s.students.forEach(t=>r.push([s.cls,s.course,s.prof,fa(s.start),s.sd??'',s.end?fa(s.end):'',s.ed??'',t.name,t.id,t.ev.map((e,i)=>(i%2?'خروج ':'ورود ')+fa(e)+dtxt(t.dist&&t.dist[i])).join(' | ')])));
const csv='\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='attendance.csv';a.click()}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
